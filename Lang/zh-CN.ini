advanced.encode_info=x264 Grain 默认使用 Faster + VBR 单次；tune grain、可见自动码率与 3x/6x VBV 保持不变。需要精确平均码率分配时可选 2-Pass；Medium / Slow 仅作为高计算量对照。\n\nHigh10 默认关闭：普通 LUT / Grain / 画幅链保持 10-bit，到编码边界才转换为 8-bit High Profile；开启后输出 yuv420p10le / High 10 Profile。
advanced.hdr_info=自动：AV1 / HEVC 可保持 HDR 时继续 HDR Preserve；一旦选择 x264、BT.709 LUT、OpenSVPFlow 或 H.264 上传版，HDR 文件先 Tone Mapping 到 SDR 再处理。\n\n保持 HDR：不自动降级，不兼容功能继续旁路。强制 SDR：所有 PQ / HLG 输入都先转成 BT.709 SDR。SDR 输入不受此选项影响。
advanced.crop_info=0 = 保持原来的自动约 2.39:1 计算。\n大于 0 时同时作为「加黑边」和「裁剪」的上下单边尺寸。\n例如 50：加黑边时上下各覆盖 50 px；裁剪时上下各裁掉 50 px。

