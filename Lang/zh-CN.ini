tooltip.subtitle=硬字幕独立于 H.264 上传版；启用后烧写到主输出，若同时生成 H.264 上传版则副本也包含同一字幕。默认距最终输出画面下沿 5px、水平居中。
tooltip.interpolation=逐行 SDR 输入插值到 60 fps；使用 Algo 13 + EncodeGUI Analyse。与自动电影帧率互斥。
tooltip.upload=附加 H.264 上传版固定使用 x264 Grain 8-bit 兼容输出；与主输出共用最终分辨率 / FPS / 高动态状态，但拥有独立码率。
tooltip.upload_bitrate=H.264 上传版使用与主线相同的 x264 设置：默认 Faster + tune grain + VBR 单次；高级设置可切换 Medium / Slow 与 2-Pass / 3-Pass。自动模式共用分辨率 / 最终 FPS / 高动态推荐策略，并直接显示实际 kbps；也可手动输入。
tooltip.upload_auto=勾选：上传版按 x264 Grain 的分辨率 / 最终 FPS / 高动态策略自动推荐；取消后可在左侧直接输入自定义 kbps。
tooltip.high_motion=统一高动态模式：自动码率提高到高速运动档；NVENC 在硬件支持时使用更深 Lookahead / Fullres Multipass / adaptive B / scene-cut；x264 保持当前 preset + tune grain + 当前 VBR 模式，并使用高动态码率。
tooltip.bitrate_auto=勾选：码率框实时显示当前视频的自动推荐 kbps；分辨率、最终 FPS、编码器或高动态状态改变时自动刷新。取消勾选后可手动输入，程序不会偷偷覆盖。
tooltip.bitrate=单位 kbps。自动模式下这里直接显示计算结果；启动后日志会再次列出分辨率档位、FPS 系数、b:v、3× maxrate 与 6× bufsize。
tooltip.bitrate_recommend=自动推荐：{0} kbps · {1} · 60fps基准 {2} kbps · 最终 {3:0.###} fps · FPS系数 {4:0.###} · {5}。启动任务后 Bridge 会按每个文件实际输出再次计算。
tooltip.upload_recommend=H.264 上传版自动推荐：{0} kbps · x264 Grain · {1} · 60fps基准 {2} kbps · 最终 {3:0.###} fps · FPS系数 {4:0.###} · {5}。Bridge 会按每个文件实际输出再次计算。
tooltip.sfe_unavailable=NVENC: Split Frame Encoding (SFE) - 当前 GPU 未检测到可用的多 NVENC 引擎。
