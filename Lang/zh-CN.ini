subtitle.note=默认：huiwen-mincho / 69 / 白色 / 黑色边框与阴影 / Outline 1 / Shadow 1 / 距最终输出画面下沿 5px、水平居中。启用添加黑边时，黑边属于最终输出画面，字幕自然位于下方黑边内；不添加黑边时，字幕位于视频画面底部并覆盖少量内容。字号、边距、描边和阴影均以 1920×1080 为基准，实际编码按输出宽度等比缩放。\n支持 SRT / ASS / SSA / WebVTT 等文本字幕；PGS/DVD 图形字幕暂不烧写。多文件任务建议使用各视频同名字幕。

