tooltip.sfe_ready=NVENC: Split Frame Encoding (SFE)\n硬件能力检测：最多 ×{0}；grav1synth {1}；仅 AV1 Standard / UHQ 可用。
tooltip.hdr_interp_preserve=HDR Preserve：当前 OpenSVPFlow 集成使用 YUV420P8，HDR 文件由核心自动旁路插帧。可在 高级 > HDR 选择先转换为 SDR。
tooltip.hdr_upload_preserve=HDR Preserve：H.264 上传版会跳过。可在 高级 > HDR 选择先转换为 SDR。
