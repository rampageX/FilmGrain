subtitle.note=Default: huiwen-mincho / 69 / white / black border and shadow / Outline 1 / Shadow 1 / 5 px above the final frame bottom, horizontally centered. With letterbox enabled, subtitles naturally sit inside the lower black bar; without letterbox they overlay a small portion of the image. Font size, margin, outline, and shadow are based on 1920×1080 and scale with output width.\nSupports SRT / ASS / SSA / WebVTT text subtitles. PGS/DVD bitmap subtitles are not burned in. For batch jobs, same-name subtitles are recommended.

