tooltip.subtitle=Burn-in subtitles are independent of the H.264 upload copy. When enabled, they are burned into the main output and also into the upload copy if one is created. Default placement is 5 px above the final frame bottom, horizontally centered.
tooltip.interpolation=Interpolate progressive SDR input to 60 fps using Algo 13 + EncodeGUI Analyse. Mutually exclusive with automatic film-frame-rate handling.
tooltip.upload=The optional H.264 upload copy uses x264 Grain 8-bit compatibility output. It shares final resolution / FPS / High Motion state with the main output but has an independent bitrate.
tooltip.upload_bitrate=The H.264 upload copy uses the same x264 settings as the main x264 path: Faster + tune grain + single-pass VBR by default. Advanced Settings can switch to Medium / Slow or 2-Pass. Auto mode uses the same resolution / final FPS / High Motion recommendation policy and shows the actual kbps; manual input is also supported.
tooltip.upload_auto=Checked: recommend upload-copy bitrate from x264 Grain resolution / final FPS / High Motion policy. Unchecked: enter a custom kbps value on the left.
tooltip.high_motion=Unified High Motion mode: raises automatic bitrate to the fast-motion tier. NVENC uses deeper Lookahead / Fullres Multipass / adaptive B / scene-cut when supported; x264 keeps the current preset + tune grain + VBR mode and uses the High Motion bitrate.
tooltip.bitrate_auto=Checked: the bitrate field shows the live automatic kbps recommendation and refreshes when resolution, final FPS, encoder, or High Motion state changes. Unchecked: manual values are preserved.
tooltip.bitrate=Unit: kbps. Auto mode displays the calculated result here. When a job starts, the log also shows resolution tier, FPS factor, b:v, 3× maxrate, and 6× bufsize.
tooltip.bitrate_recommend=Auto recommendation: {0} kbps · {1} · 60fps base {2} kbps · final {3:0.###} fps · FPS factor {4:0.###} · {5}. Bridge recalculates from each file's actual output when the job starts.
tooltip.upload_recommend=H.264 upload auto recommendation: {0} kbps · x264 Grain · {1} · 60fps base {2} kbps · final {3:0.###} fps · FPS factor {4:0.###} · {5}. Bridge recalculates from each file's actual output.
tooltip.sfe_unavailable=NVENC: Split Frame Encoding (SFE) - No usable multi-NVENC engine configuration was detected on this GPU.
tooltip.sfe_version=NVENC: Split Frame Encoding (SFE)\ngrav1synth 0.2.2+ is required; current version: {0}
tooltip.sfe_ready=NVENC: Split Frame Encoding (SFE)\nHardware capability: up to ×{0}; grav1synth {1}; AV1 Standard / UHQ only.
tooltip.hdr_interp_preserve=HDR Preserve: the current OpenSVPFlow integration uses YUV420P8, so HDR input bypasses interpolation automatically. Choose conversion to SDR under Advanced > HDR if needed.
tooltip.hdr_upload_preserve=HDR Preserve: the H.264 upload copy is skipped. Choose conversion to SDR under Advanced > HDR if needed.
tooltip.hdr_lut_preserve=HDR Preserve: BT.709 LUT processing is bypassed. Choose conversion to SDR under Advanced > HDR if needed.
tooltip.hdr_codec_preserve=For HDR Preserve main output, use AV1 Main10 or HEVC Main10. To use x264, choose conversion to SDR under Advanced > HDR.
tooltip.hdr_interp_sdr=When needed, HDR is converted through {0} Tone Mapping to BT.709 SDR before OpenSVPFlow.
tooltip.hdr_upload_sdr=When needed, HDR is converted through {0} Tone Mapping to BT.709 SDR, allowing the H.264 upload copy.
tooltip.hdr_lut_sdr=When needed, HDR is converted through {0} Tone Mapping to BT.709 SDR before normal LUT processing.

