advanced.encode_info=x264 Grain defaults to Faster + single-pass VBR. tune grain, visible auto bitrate, and 3x/6x VBV are unchanged. Use 2-Pass when precise average bitrate allocation is needed; Medium / Slow are high-compute comparison options only.\n\nHigh10 is off by default: the LUT / Grain / framing chain stays 10-bit and converts to 8-bit High Profile only at the encode boundary. When enabled, output is yuv420p10le / High 10 Profile.
advanced.hdr_info=Auto keeps HDR Preserve for compatible AV1 / HEVC paths. If x264, a BT.709 LUT, OpenSVPFlow, or an H.264 upload copy is selected, HDR is tone-mapped to SDR before processing.\n\nPreserve HDR disables automatic downgrade and bypasses incompatible functions. Force SDR converts all PQ / HLG inputs to BT.709 SDR first. SDR input is unaffected.
advanced.crop_info=0 keeps the automatic ~2.39:1 calculation.\nValues above 0 are used as the per-side size for both letterboxing and cropping.\nExample 50: letterbox covers 50 px at both top and bottom; crop removes 50 px from both.

