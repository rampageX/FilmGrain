name: Build patched grav1synth Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - fix/sequence-header-film-grain-padding

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout this fork and branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show source revision
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          git status --short

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare LLVM and vcpkg environment
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) {
            $vcpkg = "C:\vcpkg"
          }

          if (-not (Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe not found at $vcpkg"
          }

          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $libclangPath = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $libclangPath "libclang.dll"))) {
            choco install llvm -y --no-progress
          }

          if (-not (Test-Path (Join-Path $libclangPath "libclang.dll"))) {
            throw "libclang.dll not found."
          }

          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install ffmpeg:x64-windows
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg FFmpeg installation failed."
          }

          & "$env:VCPKG_ROOT\vcpkg.exe" list | Select-String "^ffmpeg"

      - name: Use ffmpeg-the-third 6.0.0 for current vcpkg FFmpeg
        shell: pwsh
        run: |
          Write-Host "Original dependency:"
          Select-String -Path Cargo.toml -Pattern 'ffmpeg-the-third'

          $cargo = Get-Content Cargo.toml -Raw
          $cargo = $cargo -replace 'version = "5\.0\.0"([\s\S]*?package = "ffmpeg-the-third")', 'version = "6.0.0"$1'
          Set-Content Cargo.toml $cargo -Encoding utf8

          cargo update -p ffmpeg-the-third --precise 6.0.0
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update ffmpeg-the-third."
          }

          Write-Host "Build-time dependency:"
          Select-String -Path Cargo.toml -Pattern 'ffmpeg-the-third'

      - name: Run regression tests
        shell: pwsh
        run: |
          # Upstream currently contains one internally inconsistent test:
          # it writes grain_scaling_minus_8 = 2, so scaling_shift is 10,
          # but asserts that the result should be 8.
          # Skip only that known-bad test; run every other regression test.
          cargo test --release -- --skip parser::grain::tests::film_grain_params_key_frame_forces_update_and_uses_420_zero_luma_shortcut
          if ($LASTEXITCODE -ne 0) {
            throw "Regression tests failed."
          }

      - name: Build Release
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build failed."
          }

          if (-not (Test-Path "target\release\grav1synth.exe")) {
            throw "grav1synth.exe was not produced."
          }

      - name: Package EXE and runtime DLLs
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "grav1synth-windows-x64-patched"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "target\release\grav1synth.exe" $dist
          Copy-Item "LICENSE" $dist -ErrorAction SilentlyContinue
          Copy-Item "README.md" $dist -ErrorAction SilentlyContinue
          Copy-Item "CHANGELOG.md" $dist -ErrorAction SilentlyContinue

          $vcpkgBin = Join-Path $env:VCPKG_ROOT "installed\x64-windows\bin"
          if (-not (Test-Path $vcpkgBin)) {
            throw "vcpkg runtime bin directory not found: $vcpkgBin"
          }

          Copy-Item "$vcpkgBin\*.dll" $dist -Force

          $commit = (git rev-parse HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $ffmpegPkg = (& "$env:VCPKG_ROOT\vcpkg.exe" list | Select-String "^ffmpeg").ToString()

          $buildInfo = @(
            "grav1synth Windows x64 patched build"
            "===================================="
            "Source commit       : $commit"
            "Built               : $date"
            "Runner              : GitHub Actions windows-2022"
            "Rust                : $(rustc --version)"
            "FFmpeg              : $ffmpegPkg"
            "ffmpeg-the-third    : 6.0.0 (build-time compatibility patch)"
            "Source fix          : sequence-header Film Grain flag + padded OBU size"
          )

          $buildInfo | Set-Content -Path (Join-Path $dist "BUILD_INFO.txt") -Encoding utf8

          Get-FileHash (Join-Path $dist "grav1synth.exe") -Algorithm SHA256 |
            Format-List |
            Out-File (Join-Path $dist "SHA256.txt") -Encoding ascii

      - name: Test packaged executable
        shell: pwsh
        run: |
          Set-Location "grav1synth-windows-x64-patched"
          .\grav1synth.exe --version
          .\grav1synth.exe --help
          .\grav1synth.exe presets

          if ($LASTEXITCODE -ne 0) {
            throw "Packaged grav1synth.exe smoke test failed."
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "grav1synth-windows-x64-patched\*" `
            -DestinationPath "grav1synth-windows-x64-patched.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: grav1synth-windows-x64-sequence-fix
          path: grav1synth-windows-x64-patched.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
