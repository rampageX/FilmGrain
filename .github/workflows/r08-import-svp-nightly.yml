name: Import pinned OpenSVPFlow Windows pair

on:
  push:
    branches: [test/r08-hdr-sdr]
    paths: [.github/workflows/r08-import-svp-nightly.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify upstream archive and install matching pair
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'nightly-20261123-badc0debd33f'
          $zip = Join-Path $env:RUNNER_TEMP 'fgs-r08-open-svpflow.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'fgs-r08-open-svpflow'
          curl.exe --fail --silent --show-error --location --retry 3 "https://github.com/Z1xus/open-svpflow/releases/download/$tag/x86_64-pc-windows-msvc.zip" --output $zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download pinned OpenSVPFlow archive' }
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ine '64bc83d3773e9daaff33641a9e296ba9f8a95788a1a328140f098ad32b443883') { throw 'Upstream archive SHA256 mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          $plugins = '_OpenSVPFlow/Plugins'
          $hashes = [ordered]@{
            'svpflow1_vs.dll' = '72b31e0b3dd3d62a32f4a7d8277a7e98e019667af8d3e8132ac20674ec465214'
            'svpflow2_vs.dll' = 'eb24f4a3635615011a3fca76d5f80e4e75990c9d149af9e10faec41458ed0246'
          }
          foreach ($dll in $hashes.Keys) {
            $path = Join-Path $folder $dll
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $hashes[$dll]) { throw "DLL SHA256 mismatch: $dll" }
            Copy-Item -LiteralPath $path -Destination $plugins -Force
          }
          foreach ($file in @('BUILD.txt', 'CRATES.txt')) {
            Copy-Item -LiteralPath (Join-Path $folder $file) -Destination $plugins -Force
          }
          Copy-Item -LiteralPath (Join-Path $folder 'LICENSE') -Destination (Join-Path $plugins 'LICENSE_upstream.txt') -Force
          [IO.File]::WriteAllText((Join-Path $plugins 'open-svpflow-version.txt'), "$tag`n", [Text.Encoding]::ASCII)
          $manifest = @('Film Grain Studio v5.0.94 bundled OpenSVPFlow Windows DLL pair',
              "Source: Z1xus/open-svpflow $tag x86_64-pc-windows-msvc.zip",
              'Archive SHA256: 64bc83d3773e9daaff33641a9e296ba9f8a95788a1a328140f098ad32b443883',
              'SHA-256 (lowercase):')
          foreach ($dll in $hashes.Keys) { $manifest += "$($hashes[$dll])  $dll" }
          [IO.File]::WriteAllText((Join-Path $plugins 'BUNDLED_DLL_SHA256.txt'), (($manifest -join "`n") + "`n"), [Text.Encoding]::ASCII)
      - name: Verify Windows build with pinned DLLs
        shell: cmd
        run: call dotnet\build_NET_Preview.bat
      - name: Record imported files on the existing test branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _OpenSVPFlow/Plugins
          git rm -- .github/workflows/r08-import-svp-nightly.yml
          git commit -m 'bundle: pin OpenSVPFlow nightly-20261123-badc0debd33f'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit pinned DLLs' }
          git push origin HEAD:refs/heads/test/r08-hdr-sdr
          if ($LASTEXITCODE -ne 0) { throw 'Test branch moved; pinned DLL push rejected' }
