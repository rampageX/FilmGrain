name: FGS v5.0.61 Metadata Sync
on:
  push:
    branches:
      - test/lut-grain-ui-20261110-ce824368
    paths:
      - '.github/workflows/sync-v561.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Synchronize release metadata
        shell: powershell
        run: |
          & '.\.github\release\sync_native_version.ps1' -RepositoryRoot $env:GITHUB_WORKSPACE -Version '5.0.61'
          & '.\.github\release\build_release.ps1' -RepositoryRoot $env:GITHUB_WORKSPACE -Version '5.0.61' -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Release preflight failed' }
      - name: Commit synchronized files
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dotnet/FilmGrain_Studio_NET_Preview.cs .github/release/version.txt CHANGELOG.md .github/release/RELEASE_NOTES.md README.md README_FilmGrain_Studio.txt README_Toolkit.txt STABLE_BASELINE.txt
          git diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) { throw 'Version sync produced no changes' }
          git commit -m 'release: prepare Film Grain Studio v5.0.61'
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata commit failed' }
          git push origin ('HEAD:' + $env:GITHUB_REF_NAME)
          if ($LASTEXITCODE -ne 0) { throw 'Release branch push failed' }
