name: Release Film Grain Studio v4.6.3

on:
  push:
    paths:
      - '.github/workflows/release-v4.6.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Run formal release script
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/release_v463.py
