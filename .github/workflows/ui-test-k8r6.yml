name: FGS GPU UI test Q4N8
on:
  push:
    branches:
      - test/ui-polish-k8r6
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libplacebo
      - name: Build and validate FGS and GPU runtime
        shell: powershell
        env:
          FGS_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\.github\release\build_release.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Version '5.0.74' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'fgs-build')
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
      - name: Verify startup and package test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stable = Join-Path $env:RUNNER_TEMP 'fgs-build\FilmGrain_Studio_v5.0.74_Stable.zip'
          $stage = Join-Path $env:RUNNER_TEMP 'fgs-stage'
          Expand-Archive -LiteralPath $stable -DestinationPath $stage
          & .\dotnet\BuildTools\Test_UI_Startup.ps1 -Exe (Join-Path $stage 'FilmGrain_Studio.exe')
          if ($LASTEXITCODE -ne 0) { throw "UI audit failed" }
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item -LiteralPath (Join-Path $stage 'FilmGrain_Studio.exe') -Destination out\FilmGrain_Studio_Q4N8.exe
          Copy-Item -LiteralPath (Join-Path $stage 'GpuAdvancedPreview') -Destination out\GpuAdvancedPreview -Recurse
          git archive --format=zip --output=out/FGS_Source_Q4N8.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
          $mainHash = (Get-FileHash -Algorithm SHA256 out\FilmGrain_Studio_Q4N8.exe).Hash
          $gpuHash = (Get-FileHash -Algorithm SHA256 out\GpuAdvancedPreview\fgs_gpu_preview.exe).Hash
          $commit = (git rev-parse HEAD).Trim()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path out) 'BUILD_INFO.txt'), "Commit: $commit`r`nMain EXE SHA256: $mainHash`r`nGPU EXE SHA256: $gpuHash`r`n")
      - uses: actions/upload-artifact@v4
        with:
          name: FGS_GPU_UI_Q4N8
          path: out/
          if-no-files-found: error
