name: FGS interpolation start time Windows verification
on:
  push:
    branches:
      - test/interpolation-start-time
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax and UTF-8 BOM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('dotnet\BuildTools\Test_InterpolationTimelineStart.ps1','dotnet\BuildTools\Test_R04c_NvencFrucAv1.ps1','dotnet\BuildTools\Test_R08_HdrSdr.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -ne 0) { throw ($path + ': ' + ($errors | Out-String)) }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path).Path)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw ('Missing BOM: ' + $path) }
          }
      - name: Compile .NET Framework 4.8 GUI and CLI
        shell: cmd
        run: call dotnet\build_NET_Preview.bat
      - name: Timeline and earlier route regressions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'FilmGrain_Studio.exe'
          foreach ($test in @(
            '.\dotnet\BuildTools\Test_InterpolationTimelineStart.ps1',
            '.\dotnet\BuildTools\Test_R04c_NvencFrucAv1.ps1',
            '.\dotnet\BuildTools\Test_R08_HdrSdr.ps1',
            '.\dotnet\BuildTools\Test_R07_HableProbe.ps1',
            '.\dotnet\BuildTools\Test_R05_WorkspacePlans.ps1',
            '.\dotnet\BuildTools\Test_R05_WorkspaceDrive.ps1',
            '.\dotnet\BuildTools\Test_R04b_NvencAiAv1.ps1',
            '.\dotnet\BuildTools\Test_R04a_SvpAv1.ps1',
            '.\dotnet\BuildTools\Test_R03_Av1Fruc.ps1',
            '.\dotnet\BuildTools\Test_R02_BilateralS4.ps1',
            '.\dotnet\BuildTools\Test_R01_InlinePlate.ps1',
            '.\dotnet\BuildTools\Test_HLG_GPU_L4Q6.ps1',
            '.\dotnet\BuildTools\Test_NullLogCallback.ps1'
          )) {
            & $test -Exe $exe
            if (-not $?) { throw ('Regression failure: ' + $test) }
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          ('GitCommit=' + $env:GITHUB_SHA) | Set-Content -LiteralPath 'CI_PROOF.txt' -Encoding Ascii
          ('ExecutableSHA256=' + $hash) | Add-Content -LiteralPath 'CI_PROOF.txt' -Encoding Ascii
          git archive --format=zip --prefix=FilmGrain/ --output=FilmGrain_Studio_v5.1.01_HdrFrucDirect_D4E8A1_Full_Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item -LiteralPath $exe -Destination 'FilmGrain_Studio_v5.1.01_HdrFrucDirect_D4E8A1.exe'
      - name: Upload test executable and exact source
        uses: actions/upload-artifact@v4
        with:
          name: FGS_HdrFrucDirect_D4E8A1_Test_and_Source
          path: |
            FilmGrain_Studio_v5.1.01_HdrFrucDirect_D4E8A1.exe
            FilmGrain_Studio_v5.1.01_HdrFrucDirect_D4E8A1_Full_Source.zip
            CI_PROOF.txt
          if-no-files-found: error
          retention-days: 14
