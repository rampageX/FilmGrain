name: Film Grain Studio Release

on:
  push:
    branches:
      - master
    paths:
      - '.github/release/version.txt'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create GitHub Release after a successful manual build'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: film-grain-studio-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate formal package
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath '.github\release\version.txt' -Raw).Trim()
          if (-not $version) { throw 'Release version is empty.' }

          $name = 'FilmGrain_Studio_v' + $version + '_Stable'
          $zip = Join-Path $env:GITHUB_WORKSPACE ($name + '.zip')
          $shaFile = $zip + '.sha256'

          & '.\.github\release\build_release.ps1' `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Version $version `
            -OutputDirectory $env:GITHUB_WORKSPACE

          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Shared release core did not create: $zip"
          }
          if (-not (Test-Path -LiteralPath $shaFile -PathType Leaf)) {
            throw "Shared release core did not create: $shaFile"
          }

          "FGS_RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FGS_RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FGS_RELEASE_SHA=$shaFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "artifact_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$([IO.Path]::GetFileName($zip))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha_name=$([IO.Path]::GetFileName($shaFile))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.publish == true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:FGS_RELEASE_TAG" "$env:FGS_RELEASE_ZIP" "$env:FGS_RELEASE_SHA" --target "$env:GITHUB_SHA" --title "Film Grain Studio $env:FGS_RELEASE_TAG" --notes-file ".github/release/RELEASE_NOTES.md"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.zip_name }}
            ${{ steps.build.outputs.sha_name }}
          if-no-files-found: error

      - name: Delete merged release branch
        if: success() && (github.event_name == 'push' || inputs.publish == true)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath '.github\release\version.txt' -Raw).Trim()
          $ref = 'heads/release/v' + $version
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/$ref"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release branch already absent or could not be deleted: $ref"
            exit 0
          }
