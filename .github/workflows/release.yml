name: Film Grain Studio Release

on:
  push:
    branches:
      - master
    paths:
      - '.github/release/version.txt'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create GitHub Release after a successful manual build'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: film-grain-studio-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up UCRT64 GPU preview toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libplacebo

      - name: Build and validate formal package
        id: build
        shell: powershell
        env:
          FGS_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath '.github\release\version.txt' -Raw).Trim()
          if (-not $version) { throw 'Release version is empty.' }

          $name = 'FilmGrain_Studio_v' + $version + '_Stable'
          $zip = Join-Path $env:GITHUB_WORKSPACE ($name + '.zip')
          $shaFile = $zip + '.sha256'
          $sourceZip = Join-Path $env:GITHUB_WORKSPACE ('FilmGrain_Studio_v' + $version + '_Source.zip')
          $sourceSha = $sourceZip + '.sha256'
          $combinedZip = Join-Path $env:GITHUB_WORKSPACE ('FilmGrain_Studio_v' + $version + '_Release_and_Source.zip')
          $combinedSha = $combinedZip + '.sha256'

          & '.\.github\release\build_release.ps1' `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Version $version `
            -OutputDirectory $env:GITHUB_WORKSPACE

          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Shared release core did not create: $zip"
          }
          if (-not (Test-Path -LiteralPath $shaFile -PathType Leaf)) {
            throw "Shared release core did not create: $shaFile"
          }

          foreach ($file in @($sourceZip, $sourceSha)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Shared release core did not create: $file" }
          }
          Compress-Archive -LiteralPath @($zip, $sourceZip) -DestinationPath $combinedZip -CompressionLevel Optimal -Force
          $combinedHash = (Get-FileHash -LiteralPath $combinedZip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($combinedSha, ($combinedHash + '  ' + [IO.Path]::GetFileName($combinedZip) + "`r`n"), (New-Object System.Text.UTF8Encoding($false)))
          "FGS_SOURCE_ZIP=$sourceZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FGS_SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "source_zip_name=$([IO.Path]::GetFileName($sourceZip))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_sha_name=$([IO.Path]::GetFileName($sourceSha))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "FGS_COMBINED_ZIP=$combinedZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FGS_COMBINED_SHA=$combinedSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "combined_zip_name=$([IO.Path]::GetFileName($combinedZip))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "combined_sha_name=$([IO.Path]::GetFileName($combinedSha))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "FGS_RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FGS_RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FGS_RELEASE_SHA=$shaFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "artifact_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$([IO.Path]::GetFileName($zip))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha_name=$([IO.Path]::GetFileName($shaFile))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.publish == true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:FGS_RELEASE_TAG" "$env:FGS_RELEASE_ZIP" --target "$env:GITHUB_SHA" --title "Film Grain Studio $env:FGS_RELEASE_TAG" --notes-file ".github/release/RELEASE_NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Stable Release creation failed.' }
          # Temporary combined download: user must confirm before it may be deleted.
          gh release upload "$env:FGS_RELEASE_TAG" "$env:FGS_COMBINED_ZIP"
          if ($LASTEXITCODE -ne 0) { throw 'Combined Release_and_Source upload failed.' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.zip_name }}
            ${{ steps.build.outputs.combined_zip_name }}
          if-no-files-found: error

      - name: Delete accepted test branch after successful release
        if: success() && (github.event_name == 'push' || inputs.publish == true)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath '.github\release\version.txt' -Raw).Trim()
          if ($version -eq '5.0.86') {
            $ref = 'heads/test/s4-three-combos-r6k4p9'
            $expected = '4e48529f4830b2d047d4f49e56060374a330bfa7'
          } elseif ($version -eq '5.0.87') {
            $ref = 'heads/test/r01-vulkan-plate'
            $expected = '0b776237e37b01c689e7dde8d4f18493efd6356c'
          } elseif ($version -eq '5.0.88') {
            $ref = 'heads/test/r02-bilateral-s4'
            $expected = '76a935c0564fcf77fc030f00ca473873b0f6dc6f'
          } elseif ($version -eq '5.0.89') {
            $ref = 'heads/test/r03-av1-fruc'
            $expected = '107a9b08cd97e20a58879009b02c4982aeb33353'
          } elseif ($version -eq '5.0.90') {
            $ref = 'heads/test/r04a-svp-av1'
            $expected = 'b23de2002837c68aa5dfc57d217944886771630b'
          } elseif ($version -eq '5.0.91') {
            $ref = 'heads/test/r04b-nvenc-ai-av1'
            $expected = 'a419423b1e312239186394aa1abce3d127a71fed'
          } elseif ($version -eq '5.0.92') {
            $ref = 'heads/test/r05-workspace-preflight'
            $expected = '260d1fca32313c088890a5a20b9b872e34286426'
          } elseif ($version -eq '5.0.93') {
            $ref = 'heads/test/r07-hable-probe'
            $expected = '56056608eefe7e1188f1a7f66ee078cab85fb2a7'
          } elseif ($version -eq '5.0.94') {
            $ref = 'heads/test/r08-hdr-sdr'
            $expected = $env:GITHUB_SHA
          } else { exit 0 }
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/$ref" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Accepted test branch verification failed.' }
          if ($sha.Trim() -ne $expected) { throw 'Accepted test branch changed; refusing deletion.' }
          git merge-base --is-ancestor $expected $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Accepted test commit is not an ancestor of release; refusing deletion.' }
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/$ref"
          if ($LASTEXITCODE -ne 0) { throw 'Accepted test branch deletion failed.' }
      - name: Delete merged release branch
        if: success() && (github.event_name == 'push' || inputs.publish == true)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath '.github\release\version.txt' -Raw).Trim()
          $ref = 'heads/release/v' + $version
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/$ref"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release branch already absent or could not be deleted: $ref"
            exit 0
          }
