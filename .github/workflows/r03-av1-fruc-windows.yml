name: FGS R03 AV1 FRUC Windows verification

on:
  push:
    branches:
      - test/r03-av1-fruc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
      - name: Validate R03 PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'dotnet\BuildTools\Test_R03_Av1Fruc.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ('R03 PowerShell parser errors: ' + ($errors | Out-String)) }
          Write-Host 'PASS R03 PowerShell syntax'
      - name: Build verified .NET Framework 4.8 executable
        shell: cmd
        run: call dotnet\build_NET_Preview.bat
      - name: Run R03, R02, R01 and HDR contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'FilmGrain_Studio.exe'
          & '.\dotnet\BuildTools\Test_R03_Av1Fruc.ps1' -Exe $exe
          if (-not $?) { throw 'R03 AV1 FRUC contract failed' }
          & '.\dotnet\BuildTools\Test_R02_BilateralS4.ps1' -Exe $exe
          if (-not $?) { throw 'R02 regression failed' }
          & '.\dotnet\BuildTools\Test_R01_InlinePlate.ps1' -Exe $exe
          if (-not $?) { throw 'R01 regression failed' }
          & '.\dotnet\BuildTools\Test_HLG_GPU_L4Q6.ps1' -Exe $exe
          if (-not $?) { throw 'HDR regression failed' }
          & '.\dotnet\BuildTools\Test_NullLogCallback.ps1' -Exe $exe
          if (-not $?) { throw 'Execution callback regression failed' }
          Write-Host ('R03 Windows EXE SHA256: ' + (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash)
      - name: Upload candidate EXE
        uses: actions/upload-artifact@v4
        with:
          name: FGS_R03_Av1FRUC_5B8C2F_EXE
          path: FilmGrain_Studio.exe
          if-no-files-found: error
          retention-days: 14
