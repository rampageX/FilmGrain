name: FGS R02 Bilateral S4 Windows verification

on:
  push:
    branches:
      - test/r02-bilateral-s4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
      - name: Validate R02 PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'dotnet\BuildTools\Test_R02_BilateralS4.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ('R02 PowerShell parser errors: ' + ($errors | Out-String)) }
          Write-Host 'PASS R02 PowerShell syntax'
      - name: Build verified .NET Framework 4.8 executable
        shell: cmd
        run: call dotnet\build_NET_Preview.bat
      - name: Run R02 with R01 and S4 regression contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'FilmGrain_Studio.exe'
          & '.\dotnet\BuildTools\Test_R02_BilateralS4.ps1' -Exe $exe
          if (-not $?) { throw 'R02 Bilateral route regression failed' }
          & '.\dotnet\BuildTools\Test_S4_GpuBorder.ps1'
          if (-not $?) { throw 'Existing S4 graph and Alpha regression failed' }
          & '.\dotnet\BuildTools\Test_R01_InlinePlate.ps1' -Exe $exe
          if (-not $?) { throw 'R01 inline Plate regression failed' }
          & '.\dotnet\BuildTools\Test_HLG_GPU_L4Q6.ps1' -Exe $exe
          if (-not $?) { throw 'HLG/PQ GPU graph regression failed' }
          & '.\dotnet\BuildTools\Test_NullLogCallback.ps1' -Exe $exe
          if (-not $?) { throw 'Execution callback regression failed' }
          Write-Host ('R02 Windows EXE SHA256: ' + (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash)
      - name: Upload candidate EXE only
        uses: actions/upload-artifact@v4
        with:
          name: FGS_R02_BilateralS4_B8F13D_EXE
          path: FilmGrain_Studio.exe
          if-no-files-found: error
          retention-days: 14
