name: Repair v4.6.2 release payloads

on:
  push:
    branches:
      - master
    paths:
      - '.github/release/v462-repair-trigger.txt'

permissions:
  contents: read

jobs:
  repair:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect SmartFilter payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tempRoot = Join-Path $env:RUNNER_TEMP ('FGS_v462_diag_' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null

          $py = Join-Path $tempRoot 'decode.py'
          $pyText = @'
          import gzip
          import pathlib
          import sys
          import zlib

          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])
          mode = sys.argv[3]
          data = src.read_bytes()
          if mode == 'raw':
              raw = zlib.decompress(data[10:-8], -15)
          else:
              raw = gzip.decompress(data)
          dst.write_bytes(raw)
          print(len(raw))
          '@
          [System.IO.File]::WriteAllText($py,$pyText,(New-Object System.Text.UTF8Encoding($false)))

          try {
              foreach ($name in @('03_LUT_SmartFilter_V1.ps1.gz.b64','04_LUT_SmartFilter_V2.ps1.gz.b64','05_LUT_UI.ps1.gz.b64','06_Studio_HDR_UI.ps1.gz.b64','07_Docs.ps1.gz.b64','99_Cleanup.ps1.gz.b64')) {
                  $src = Join-Path '.github\release\v462_payloads' $name
                  $gz = Join-Path $tempRoot ($name + '.gz')
                  $out = Join-Path $tempRoot ($name -replace '\.gz\.b64$','')
                  [System.IO.File]::WriteAllBytes($gz,[Convert]::FromBase64String((Get-Content -LiteralPath $src -Raw).Trim()))
                  $mode = if ($name.StartsWith('03_')) { 'raw' } else { 'gzip' }
                  Write-Host "=== DECODE $name / mode=$mode ==="
                  & python $py $gz $out $mode
                  if ($LASTEXITCODE -ne 0) {
                      Write-Host "DECODE FAILED: $name"
                      continue
                  }

                  $bytes = [System.IO.File]::ReadAllBytes($out)
                  Write-Host "BYTES=$($bytes.Length) BOM=$($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)"
                  $tokens = $null
                  $errs = $null
                  [void][System.Management.Automation.Language.Parser]::ParseFile($out,[ref]$tokens,[ref]$errs)
                  if ($errs -and $errs.Count -gt 0) {
                      Write-Host "PARSE_ERRORS=$($errs.Count) FIRST=$([string]$errs[0].Message)"
                  } else {
                      Write-Host 'PARSE_OK'
                  }

                  if ($name.StartsWith('03_')) {
                      Write-Host '===== BEGIN 03 TAIL ====='
                      Get-Content -LiteralPath $out -Encoding UTF8 -Tail 120
                      Write-Host '===== END 03 TAIL ====='
                  }
                  if ($name.StartsWith('04_')) {
                      Write-Host '===== BEGIN 04 SCRIPT ====='
                      Get-Content -LiteralPath $out -Encoding UTF8
                      Write-Host '===== END 04 SCRIPT ====='
                  }
                  if ($name.StartsWith('05_')) {
                      Write-Host '===== BEGIN 05 SCRIPT ====='
                      Get-Content -LiteralPath $out -Encoding UTF8
                      Write-Host '===== END 05 SCRIPT ====='
                  }
              }
          } finally {
              Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
