name: FGS VFG HDR automatic NVEncC detection test
on:
  push:
    branches:
      - test/vfg-hdr10
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify FGS on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmd.exe /d /s /c 'call dotnet\build_NET_Preview.bat'
          if ($LASTEXITCODE -ne 0) {
            # On windows-2022, legacy Windows PowerShell may lack Get-FileHash.
            # Never skip the binary audit: rerun that same auditor in PowerShell 7.
            $compiled = 'dotnet\build\FilmGrain_Studio_NET_Preview.exe'
            if (-not (Test-Path -LiteralPath $compiled -PathType Leaf)) { throw "C# compilation failed; executable missing" }
            & pwsh.exe -NoProfile -NonInteractive -File 'dotnet\BuildTools\Test_Framework_Api.ps1' -Executable $compiled
            if ($LASTEXITCODE -ne 0) { throw "Framework API audit failed under PowerShell 7" }
            Copy-Item -LiteralPath $compiled -Destination 'FilmGrain_Studio.exe' -Force
          }
          if (-not (Test-Path -LiteralPath 'FilmGrain_Studio.exe' -PathType Leaf)) { throw 'Compiled FGS EXE not found' }
      - name: Package matching EXE and complete committed source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'FGS_VFG_AutoDetect_M6Q9'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath 'FilmGrain_Studio.exe' -Destination (Join-Path $dir 'FilmGrain_Studio_VFG_AutoDetect_M6Q9.exe')
          Copy-Item -LiteralPath 'VFG_AutoDetect_测试说明.txt' -Destination $dir
          $src = Join-Path $dir 'FGS_VFG_AutoDetect_M6Q9_Source.zip'
          & git archive --format=zip --output=$src HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $src)) { throw 'Source archive failed' }
          $exe = Join-Path $dir 'FilmGrain_Studio_VFG_AutoDetect_M6Q9.exe'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          $info = "FGS VFG AutoDetect M6Q9 experimental Windows build" + [Environment]::NewLine + "Commit: " + $env:GITHUB_SHA + [Environment]::NewLine + "Base: a38a82350defd970daf6f2d9a73d4da56e9024f9" + [Environment]::NewLine + "EXE SHA256: " + $hash
          [IO.File]::WriteAllText((Join-Path $dir 'BUILD_INFO.txt'),$info,(New-Object System.Text.UTF8Encoding($false)))
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath 'artifacts\FGS_VFG_AutoDetect_Windows_M6Q9.zip' -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath 'artifacts\FGS_VFG_AutoDetect_Windows_M6Q9.zip')) { throw 'Missing package' }
      - uses: actions/upload-artifact@v4
        with:
          name: FGS_VFG_AutoDetect_Windows_M6Q9
          path: artifacts/FGS_VFG_AutoDetect_Windows_M6Q9.zip
          if-no-files-found: error
