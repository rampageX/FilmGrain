name: FGS I18N Test Package

on:
  push:
    branches:
      - test/i18n-v4.7.5-k7m2q
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'FilmGrain_Studio_v4.7.5_I18N_TEST_K7M2Q'
          $stage = Join-Path $env:RUNNER_TEMP $name
          $zip = Join-Path $env:GITHUB_WORKSPACE ($name + '.zip')

          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Where-Object { $_.Name -notin @('.git','.github') } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object {
            $ext = $_.Extension.ToLowerInvariant()
            if ($ext -in @('.ps1','.bat','.cmd','.vbs','.ini')) {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $offset = 0
              if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { $offset = 3 }
              $text = [System.Text.Encoding]::UTF8.GetString($bytes, $offset, $bytes.Length - $offset)
              $text = $text -replace "\r?\n", "`r`n"
              if ($ext -eq '.ps1') {
                [System.IO.File]::WriteAllText($_.FullName, $text, $utf8Bom)
              } else {
                [System.IO.File]::WriteAllText($_.FullName, $text, $utf8NoBom)
              }
            }
          }

          $badQuotes = @()
          Get-ChildItem -LiteralPath $stage -Recurse -Filter '*.ps1' -File | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            if ($text -match '[“”‘’]') { $badQuotes += $_.FullName }
          }
          if ($badQuotes.Count -gt 0) { throw ('Curly quotes found: ' + ($badQuotes -join ', ')) }

          $badCaret = @()
          Get-ChildItem -LiteralPath $stage -Recurse -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.bat','.cmd') } | ForEach-Object {
            $lines = [System.IO.File]::ReadAllLines($_.FullName)
            for ($i = 0; $i -lt $lines.Length; $i++) {
              if ($lines[$i] -match '\^\s+$') { $badCaret += ($_.FullName + ':' + ($i + 1)) }
            }
          }
          if ($badCaret.Count -gt 0) { throw ('Caret trailing whitespace: ' + ($badCaret -join ', ')) }

          $required = @(
            'FilmGrain_Universal_HEVC_AV1_GUI.bat',
            'Utils\FilmGrain_Studio.ps1',
            'Utils\FilmGrain_Language.ps1',
            'Lang\zh-CN.ini',
            'Lang\en-US.ini',
            'Utils\_FilmGrainSimplified\NoiseFallback_512x512_RGBA8.rgba'
          )
          foreach ($rel in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $rel) -PathType Leaf)) { throw "Required file missing: $rel" }
          }

          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(($zip + '.sha256'), ($hash + '  ' + [IO.Path]::GetFileName($zip) + "`r`n"), $utf8NoBom)

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: FilmGrain_Studio_v4.7.5_I18N_TEST_K7M2Q
          path: |
            FilmGrain_Studio_v4.7.5_I18N_TEST_K7M2Q.zip
            FilmGrain_Studio_v4.7.5_I18N_TEST_K7M2Q.zip.sha256
          if-no-files-found: error
