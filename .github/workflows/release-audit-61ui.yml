name: FGS v5.0.61 UI Audit
on:
  push:
    branches:
      - test/lut-grain-ui-20261110-ce824368
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build FGS test executable
        shell: cmd
        run: call dotnet\build_NET_Preview.bat
      - name: Test current seven-page UI
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File dotnet\BuildTools\Test_UI_Startup.ps1
