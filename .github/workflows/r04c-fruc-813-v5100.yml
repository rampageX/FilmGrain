name: FGS FRUC 813 integration Windows verification
on:
  pull_request:
    branches: [master]
    paths:
      - 'dotnet/**'
      - '.github/workflows/r04c-fruc-813-v5100.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify source and script syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Git source verification failed' }
          git merge-base --is-ancestor 58e185c407a820692fe68978f0a4768353e3fce2 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Incorrect base' }
          foreach ($path in @('dotnet\BuildTools\Test_R04c_NvencFrucAv1.ps1','dotnet\BuildTools\Test_R04b_NvencAiAv1.ps1','dotnet\BuildTools\Test_R04a_SvpAv1.ps1','dotnet\BuildTools\Test_R03_Av1Fruc.ps1')) {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -ne 0) { throw ('PS1 parse failed: '+$path) }
            $bytes=[IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path).Path)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw ('Missing UTF-8 BOM: '+$path) }
          }
      - name: Build .NET Framework 4.8 executable
        shell: cmd
        run: call dotnet\build_NET_Preview.bat
      - name: Verify route and earlier regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:GITHUB_WORKSPACE 'FilmGrain_Studio.exe'
          foreach ($test in @(
            '.\dotnet\BuildTools\Test_R04c_NvencFrucAv1.ps1',
            '.\dotnet\BuildTools\Test_R04b_NvencAiAv1.ps1',
            '.\dotnet\BuildTools\Test_R04a_SvpAv1.ps1',
            '.\dotnet\BuildTools\Test_R03_Av1Fruc.ps1',
            '.\dotnet\BuildTools\Test_R02_BilateralS4.ps1',
            '.\dotnet\BuildTools\Test_R01_InlinePlate.ps1',
            '.\dotnet\BuildTools\Test_HLG_GPU_L4Q6.ps1',
            '.\dotnet\BuildTools\Test_NullLogCallback.ps1'
          )) {
            & $test -Exe $exe
            if (-not $?) { throw ('Regression failed: '+$test) }
          }
      - name: Package matching test executable and complete tracked source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path 'ci-out' -Force | Out-Null
          Copy-Item -LiteralPath 'FilmGrain_Studio.exe' -Destination 'ci-out\FilmGrain_Studio_R04c_Q7M4.exe'
          git archive --format=zip --output=ci-out/FGS_R04c_Q7M4_Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $commit=git rev-parse HEAD
          $sha=(Get-FileHash -LiteralPath 'ci-out\FilmGrain_Studio_R04c_Q7M4.exe' -Algorithm SHA256).Hash
          @("commit=$commit","exe_sha256=$sha") | Set-Content -LiteralPath 'ci-out\SOURCE_BUILD_INFO.txt' -Encoding UTF8
          Write-Host "commit=$commit exe_sha256=$sha"
      - name: Upload matching EXE and source
        uses: actions/upload-artifact@v4
        with:
          name: FGS_R04c_Q7M4_Windows
          path: ci-out/
          if-no-files-found: error
          retention-days: 14
