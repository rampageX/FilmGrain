name: FGS G04c GPU LUT Windows candidate
on:
  push:
    branches: [test/g04c-gpu-lut]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile verified .NET Framework GUI and core
        shell: cmd
        run: call dotnet\build_NET_Preview.bat
      - name: G04c and protected route contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'FilmGrain_Studio.exe'
          foreach ($test in @(
              '.\dotnet\BuildTools\Test_G04c_GpuLut.ps1',
              '.\dotnet\BuildTools\Test_R01_InlinePlate.ps1',
              '.\dotnet\BuildTools\Test_R02_BilateralS4.ps1',
              '.\dotnet\BuildTools\Test_R03_Av1Fruc.ps1',
              '.\dotnet\BuildTools\Test_R04a_SvpAv1.ps1',
              '.\dotnet\BuildTools\Test_R04b_NvencAiAv1.ps1',
              '.\dotnet\BuildTools\Test_R05_WorkspacePlans.ps1',
              '.\dotnet\BuildTools\Test_R07_HableProbe.ps1',
              '.\dotnet\BuildTools\Test_R08_HdrSdr.ps1',
              '.\dotnet\BuildTools\Test_HLG_GPU_L4Q6.ps1',
              '.\dotnet\BuildTools\Test_NullLogCallback.ps1')) {
            & $test -Exe $exe
            if (-not $?) { throw ('Regression failure: ' + $test) }
          }
          & '.\dotnet\BuildTools\Test_FilmBorderAv1UiGuard.ps1'
          if (-not $?) { throw 'AV1 film border guard regression failed.' }
          ('GitCommit=' + $env:GITHUB_SHA) | Set-Content -LiteralPath 'G04c_CI_PROOF.txt' -Encoding Ascii
          ('ExecutableSHA256=' + (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash) | Add-Content -LiteralPath 'G04c_CI_PROOF.txt' -Encoding Ascii
          ('Status=Windows CI; GPU acceptance pending') | Add-Content -LiteralPath 'G04c_CI_PROOF.txt' -Encoding Ascii
          git archive --format=zip --output=FGS_G04c_B6N3_Full_Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item -LiteralPath $exe -Destination 'FilmGrain_Studio_G04c_B6N3.exe'
      - name: Upload matching candidate and source
        uses: actions/upload-artifact@v4
        with:
          name: FGS_G04c_B6N3_Test_and_Source
          path: |
            FilmGrain_Studio_G04c_B6N3.exe
            FGS_G04c_B6N3_Full_Source.zip
            G04c_CI_PROOF.txt
          if-no-files-found: error
          retention-days: 14
