name: Release Film Grain Studio v4.7.0

on:
  push:
    branches: [master]
    paths: ['.github/release/v470-trigger.txt']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run v4.7.0 Windows release payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem -LiteralPath '.github\release' -File -Filter 'v470_payload_*.b64' | Sort-Object Name
          if (-not $parts) { throw 'v4.7.0 payload chunks not found.' }
          $b64 = ($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
          $temp = Join-Path $env:RUNNER_TEMP ('fgs470_' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          $zip = Join-Path $temp 'payload.zip'
          $payload = Join-Path $temp 'payload'
          $log = Join-Path $env:RUNNER_TEMP 'v470-release.log'
          [System.IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          Expand-Archive -LiteralPath $zip -DestinationPath $payload -Force

          # Windows PowerShell 5 requires a BOM for reliable UTF-8 parsing of Chinese literals.
          $scriptPath = Join-Path $payload 'release-v470.ps1'
          $scriptText = [System.IO.File]::ReadAllText($scriptPath,[System.Text.Encoding]::UTF8)

          # v4.7.0 Stable uses GRAIN_ENGINE=PROCEDURAL for Digital Grain; there is no literal DIGITAL_GRAIN token in StudioBridge.
          $oldMarkerList = "'HDR_TO_SDR','Hable','Mobius','Reinhard','Gamma','Linear','Clip','DIGITAL_GRAIN'"
          $newMarkerList = "'HDR_TO_SDR','Hable','Mobius','Reinhard','Gamma','Linear','Clip','GRAIN_ENGINE'"
          if (-not $scriptText.Contains($oldMarkerList)) { throw 'Expected v4.7.0 marker validation list not found in release payload.' }
          $scriptText = $scriptText.Replace($oldMarkerList,$newMarkerList)

          [System.IO.File]::WriteAllText($scriptPath,$scriptText,(New-Object System.Text.UTF8Encoding($true)))

          # Remove the diagnostic file from the previous failed attempt before the formal commit.
          Remove-Item -LiteralPath '.github\release\v470-failure.log' -Force -ErrorAction SilentlyContinue

          $oldPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File $scriptPath -PayloadRoot $payload 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $ErrorActionPreference = $oldPreference
          if ($code -ne 0) {
            Copy-Item -LiteralPath $log -Destination '.github\release\v470-failure.log' -Force
            git config user.name 'rampageX'
            git config user.email 'punkdm@gmail.com'
            git add '.github/release/v470-failure.log'
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m 'ci: capture v4.7.0 release failure [skip ci]'
              git push origin HEAD:master
            }
            throw "v4.7.0 release payload failed with exit code $code."
          }
