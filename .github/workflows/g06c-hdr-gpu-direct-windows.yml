name: FGS G06c Windows candidate
on:
  push:
    branches: [test/g06c-hdr-gpu-direct]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile .NET Framework GUI and CLI
        shell: cmd
        run: call dotnet\build_NET_Preview.bat
      - name: G06c and protected route contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'FilmGrain_Studio.exe'
          foreach ($test in @(
              'Test_G06c_HdrGpuDirect.ps1',
              'Test_G04c_GpuLut.ps1',
              'Test_R08_HdrSdr.ps1',
              'Test_R07_HableProbe.ps1',
              'Test_R02_BilateralS4.ps1',
              'Test_S4_GpuBorder.ps1',
              'Test_R03_Av1Fruc.ps1',
              'Test_R04c_NvencFrucAv1.ps1',
              'Test_InterpolationTimelineStart.ps1',
              'Test_UI_Startup.ps1')) {
            $path = Join-Path 'dotnet\BuildTools' $test
            if ($test -eq 'Test_S4_GpuBorder.ps1') { & $path } else { & $path -Exe $exe }
            if (-not $?) { throw ('Contract failed: ' + $test) }
          }
          ('GitCommit=' + $env:GITHUB_SHA) | Set-Content -LiteralPath 'G06c_CI_PROOF.txt' -Encoding Ascii
          ('ExecutableSHA256=' + (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash) | Add-Content -LiteralPath 'G06c_CI_PROOF.txt' -Encoding Ascii
          'Status=Windows CI only; real GPU acceptance pending' | Add-Content -LiteralPath 'G06c_CI_PROOF.txt' -Encoding Ascii
          git archive --format=zip --output=FGS_G06c_R7Q2_Full_Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item -LiteralPath $exe -Destination 'FilmGrain_Studio_G06c_R7Q2.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: FGS_G06c_R7Q2_Test_and_Source
          path: |
            FilmGrain_Studio_G06c_R7Q2.exe
            FGS_G06c_R7Q2_Full_Source.zip
            G06c_CI_PROOF.txt
          if-no-files-found: error
          retention-days: 14
