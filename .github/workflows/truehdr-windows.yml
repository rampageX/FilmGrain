name: FGS TrueHDR Windows

on:
  push:
    branches:
      - test/truehdr
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truehdr-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Verify PowerShell syntax and UTF-8 BOM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
              'dotnet\BuildTools\Test_R05_WorkspacePlans.ps1',
              'dotnet\BuildTools\Test_R05_WorkspaceDrive.ps1')) {
            $path = (Resolve-Path -LiteralPath $name).Path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -ne 0) { throw ($name + ': ' + ($errors | Out-String)) }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
              throw ('Missing UTF-8 BOM: ' + $name)
            }
          }

      - name: Set up Python for static contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check 7 stage/route scenarios and GUI call-site ordering
        shell: cmd
        run: python tests\r05\verify_source_contract.py

      - name: Compile .NET Framework 4.8 GUI/CLI core
        shell: cmd
        run: call dotnet\build_NET_Preview.bat

      - name: Verify NVEncC 9.41 Windows help
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'nvencc-9.41'
          $archive = $dir + '.7z'
          & curl.exe -fsSL --retry 3 -o $archive 'https://github.com/rigaya/NVEnc/releases/download/9.41/NVEncC_9.41_x64.7z'
          if ($LASTEXITCODE -ne 0) { throw 'NVEncC dependency download failed' }
          & 7z x $archive ('-o' + $dir) -y
          if ($LASTEXITCODE -ne 0) { throw 'NVEncC dependency extraction failed' }
          $nvenc = Get-ChildItem -LiteralPath $dir -Filter 'NVEncC64.exe' -Recurse | Select-Object -First 1
          if (!$nvenc) { throw 'NVEncC64.exe missing' }
          $envLine = 'TRUEHDR_CI_NVENC=' + $nvenc.FullName
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $envLine -Encoding utf8
          $help = (& $nvenc.FullName --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch '--vpp-ngx-truehdr') { throw 'TrueHDR help missing' }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'TrueHDR_NVEncC_Help.txt'), $help)
          $help -split '\r?\n' | Where-Object { $_ -match 'contrast=|saturation=|middlegray=|maxluminance=' } | Write-Host
          foreach ($pattern in @('contrast=.*default:\s*125\)', 'saturation=.*default:\s*75\)',
              'middlegray=.*default:\s*44\)', 'maxluminance=.*default:\s*1000\)')) {
            if ($help -notmatch $pattern) { throw ('Unexpected TrueHDR help: ' + $pattern) }
          }

      - name: Verify TrueHDR command and WinForms startup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $audit = Join-Path $env:RUNNER_TEMP 'TrueHdrCommandAudit.exe'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'FilmGrain_Studio.exe'
          & $csc /nologo /utf8output ('/out:' + $audit) 'tests\truehdr\CommandAudit.cs'
          if ($LASTEXITCODE -ne 0) { throw 'Command audit compilation failed' }
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if (!$ffmpeg) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
            $ffmpeg = Get-Command ffmpeg.exe -ErrorAction Stop
          }
          $ffprobe = (Get-Command ffprobe.exe -ErrorAction Stop).Source
          $root = Join-Path $env:RUNNER_TEMP 'truehdr-path-regression'
          $null = New-Item -ItemType Directory -Path $root -Force
          $mapped = 'I:'
          if (Test-Path ($mapped + '\')) { throw 'Expected test drive I: to be free' }
          & subst.exe $mapped $root
          if ($LASTEXITCODE -ne 0) { throw 'Could not map the I: test drive' }
          try {
            $special = 'I:\-=Converter=-'
            $unicode = Join-Path $special ([regex]::Unescape('Live\uff1a\u84dd\u5149'))
            $null = New-Item -ItemType Directory -Path $unicode -Force
            $first = Join-Path $special 'HDR10 & (test) ^ % !.mkv'
            $second = Join-Path $unicode ([regex]::Unescape('\u97f3\u4e50\u4f1a & (\u6210\u7247).mkv'))
            & $ffmpeg.Source -v error -f lavfi -i 'color=s=128x72:d=1' -f lavfi -i anullsrc -f lavfi -i anullsrc -map '0:v' -map '1:a' -map '2:a' -c:v libx265 -x265-params 'pools=1:frame-threads=1:log-level=error:colorprim=9:transfer=16:colormatrix=9' -pix_fmt yuv420p10le -c:a aac -metadata ([regex]::Unescape('title=\u4e2d\u6587\u6807\u9898')) -shortest $first
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate the HDR10 fixture' }
            Copy-Item -LiteralPath $first -Destination $second
            & $audit $exe (Join-Path $env:RUNNER_TEMP 'TrueHDR_NVEncC_Help.txt') $env:TRUEHDR_CI_NVENC $ffprobe $first $second
            if ($LASTEXITCODE -ne 0) { throw 'TrueHDR command and path audit failed' }
          } finally {
            & subst.exe $mapped /d
          }
          & .\dotnet\BuildTools\Test_UI_Startup.ps1 -Exe $exe

      - name: R08 plan contracts and R01-R07 regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'FilmGrain_Studio.exe'
          foreach ($test in @(
              '.\dotnet\BuildTools\Test_R08_HdrSdr.ps1',
              '.\dotnet\BuildTools\Test_R07_HableProbe.ps1',
              '.\dotnet\BuildTools\Test_R05_WorkspacePlans.ps1',
              '.\dotnet\BuildTools\Test_R05_WorkspaceDrive.ps1',
              '.\dotnet\BuildTools\Test_R04b_NvencAiAv1.ps1',
              '.\dotnet\BuildTools\Test_R04a_SvpAv1.ps1',
              '.\dotnet\BuildTools\Test_R03_Av1Fruc.ps1',
              '.\dotnet\BuildTools\Test_R02_BilateralS4.ps1',
              '.\dotnet\BuildTools\Test_R01_InlinePlate.ps1',
              '.\dotnet\BuildTools\Test_HLG_GPU_L4Q6.ps1',
              '.\dotnet\BuildTools\Test_NullLogCallback.ps1')) {
            & $test -Exe $exe
            if (-not $?) { throw ('Regression failure: ' + $test) }
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host ('TrueHDR candidate EXE SHA256: ' + $hash)
          ('GitCommit=' + $env:GITHUB_SHA) | Set-Content -LiteralPath 'TrueHDR_CI_PROOF.txt' -Encoding Ascii
          ('ExecutableSHA256=' + $hash) | Add-Content -LiteralPath 'TrueHDR_CI_PROOF.txt' -Encoding Ascii
          ('Status=Windows CI only; pending RTX acceptance') | Add-Content -LiteralPath 'TrueHDR_CI_PROOF.txt' -Encoding Ascii

          git archive --format=zip --output=FGS_TrueHDR_4D9B7E_Full_Source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item -LiteralPath $exe -Destination 'FilmGrain_Studio_TrueHDR_4D9B7E.exe'

      - name: Upload test EXE and matching source
        uses: actions/upload-artifact@v4
        with:
          name: FGS_TrueHDR_4D9B7E_Test_and_Source
          path: |
            FilmGrain_Studio_TrueHDR_4D9B7E.exe
            FGS_TrueHDR_4D9B7E_Full_Source.zip
            TrueHDR_CI_PROOF.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload single test EXE
        uses: actions/upload-artifact@v4
        with:
          name: FilmGrain_Studio_TrueHDR_4D9B7E
          path: FilmGrain_Studio_TrueHDR_4D9B7E.exe
          if-no-files-found: error
          retention-days: 14
