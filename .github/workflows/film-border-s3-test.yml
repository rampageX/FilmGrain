name: FGS Film Border S3 test
on:
  push:
    branches:
      - test/film-border-s3
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libplacebo
      - name: Build GPU preview
        shell: msys2 {0}
        working-directory: experiments/GpuSingleFrame
        run: bash build_ucrt64.sh
      - name: Build and audit main application
        shell: cmd
        run: dotnet\build_NET_Preview.bat
      - uses: actions/upload-artifact@v4
        with:
          name: FGS-FilmBorder-S3-Windows
          if-no-files-found: error
          path: |
            FilmGrain_Studio.exe
            experiments/GpuSingleFrame/fgs_gpu_preview.exe
