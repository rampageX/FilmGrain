name: Prepare v4.8.1 Documentation

on:
  push:
    branches:
      - release/v4.8.1
    paths:
      - '.github/release/README_v4.8.1.gz.b64'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-2022
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v4.8.1 documentation and version metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)

          # Restore the reviewed README payload.
          $payload = (Get-Content -LiteralPath '.github\release\README_v4.8.1.gz.b64' -Raw).Trim()
          $compressed = [Convert]::FromBase64String($payload)
          $memory = New-Object System.IO.MemoryStream(,$compressed)
          $gzip = New-Object System.IO.Compression.GZipStream($memory,[System.IO.Compression.CompressionMode]::Decompress)
          $reader = New-Object System.IO.StreamReader($gzip,[System.Text.Encoding]::UTF8)
          $readme = $reader.ReadToEnd()
          $reader.Dispose()
          $gzip.Dispose()
          $memory.Dispose()
          [System.IO.File]::WriteAllText('README.md', ($readme -replace "\r?\n", "`n"), $utf8NoBom)

          # Preserve the user-supplied CHANGELOG history and prepend only v4.8.1.
          $changelog = [System.IO.File]::ReadAllText('CHANGELOG.md',[System.Text.Encoding]::UTF8)
          if ($changelog -notmatch '(?m)^## v4\.8\.1 ') {
            $entry = @'
## v4.8.1 — 2026-09-18

- 重新整理 `README.md`：README 只维护当前版本的功能说明、工作原理、设置方式、使用建议与已知限制，不再重复记录逐版本更新流水；历史版本变化统一由 `CHANGELOG.md` 维护。
- 在现有文档基础上重新梳理 AV1 / HEVC / H.264 三条主编码路线，以及 AV1 Film Grain metadata、真实扫描 Grain Plate、Digital Grain、GPU Film Grain (FGSIM) 四类颗粒方式，并重新组织 HDR、LUT、反交错、OpenSVPFlow、字幕、码率、上传母版、多语言与工具包结构说明。
- 保留用户补充完善后的 v4.8.0 CHANGELOG 内容，并以该文件继续作为正式版本历史基准。
- GitHub Release 页面统一改用中文，并采用与 README 相同的产品说明口径，不再使用英文 Release Notes。
- 完整继承 v4.8.0 的程序文件与已验证功能；本版不修改 StudioBridge、AV1 / HEVC / x264、FGSIM、Digital Grain、Grain Plate、HDR、LUT、OpenSVPFlow、反交错、码率、字幕、容器或 AAC 256k 编码逻辑。
- 正式版本号与发布包更新为 `v4.8.1` / `FilmGrain_Studio_v4.8.1_Stable.zip`。

'@
            $changelog = $changelog -replace '^# Film Grain Studio — CHANGELOG\r?\n\r?\n', ("# Film Grain Studio — CHANGELOG`r`n`r`n" + $entry)
          }
          [System.IO.File]::WriteAllText('CHANGELOG.md', ($changelog -replace "\r?\n", "`n"), $utf8NoBom)

          # Formal GUI version.
          $studioPath = 'Utils\FilmGrain_Studio.ps1'
          $studio = [System.IO.File]::ReadAllText($studioPath,[System.Text.Encoding]::UTF8)
          $studio = $studio -replace "\$statusVersion\.Text\s*=\s*'v4\.8\.0'", "\$statusVersion.Text = 'v4.8.1'"
          if ($studio -notmatch "\$statusVersion\.Text\s*=\s*'v4\.8\.1'") { throw 'Failed to set GUI version to v4.8.1.' }
          $studio = $studio -replace "\r?\n", "`r`n"
          [System.IO.File]::WriteAllText($studioPath,$studio,$utf8Bom)

          # Version references in secondary current-version documents.
          foreach ($doc in @('README_FilmGrain_Studio.txt','README_Toolkit.txt')) {
            $text = [System.IO.File]::ReadAllText($doc,[System.Text.Encoding]::UTF8)
            $text = $text.Replace('当前正式稳定版：v4.8.0','当前正式稳定版：v4.8.1')
            [System.IO.File]::WriteAllText($doc,$text,$utf8Bom)
          }

          $baseline = @'
Film Grain Studio formal stable baseline

Baseline:
v4.8.1

Supersedes:
v4.8.0

Formal release:
FilmGrain_Studio_v4.8.1_Stable.zip

Release scope:
- Documentation and release-presentation update based on the complete v4.8.0 functional baseline.
- README.md is maintained as the current product/function/use guide.
- CHANGELOG.md is maintained as the version-history record.
- GitHub Release notes are Chinese and follow the README product-documentation style.

Encoding core:
- Unchanged from v4.8.0.
- StudioBridge, AV1 / HEVC / x264, FGSIM, Digital Grain, Grain Plate, HDR, LUT, OpenSVPFlow, deinterlace, bitrate policy, subtitles, containers and AAC 256k remain on the verified v4.8.0 logic.

Release cleanup:
- GUI status version is v4.8.1.
- Formal package name is FilmGrain_Studio_v4.8.1_Stable.zip.
- No TEST/Beta suffixes or temporary release-preparation files.
'@
          [System.IO.File]::WriteAllText('STABLE_BASELINE.txt',($baseline -replace "\r?\n", "`r`n"),$utf8Bom)

          [System.IO.File]::WriteAllText('.github\release\version.txt',"4.8.1`n",$utf8NoBom)

          $releaseNotes = @'
# Film Grain Studio v4.8.1

Film Grain Studio 是基于 **FFmpeg、NVIDIA NVENC、libx264 与 grav1synth** 的 Windows 视频胶片化工具包，同时提供 GUI 与 CLI。项目将 AV1 Film Grain metadata、真实扫描 Grain Plate、Digital Grain 与 GPU Film Grain (FGSIM) 整合到同一套工作流中，并提供 HDR、LUT、反交错、OpenSVPFlow 插帧、字幕、Cinematic Style、自动码率和多文件处理。

## 本版说明

v4.8.1 以 v4.8.0 为完整功能基线，重点整理项目文档与发布呈现方式，**不修改编码核心和已经验证的处理参数**。

README 现在只维护当前版本的功能说明、工作原理、设置方式、使用建议与已知限制；逐版本新增、修复和发布记录统一放在 CHANGELOG 中。这样 README 更接近一份持续更新的产品说明书，而 CHANGELOG 专门承担版本历史职责。

## 当前主编码路线

| 主编码路线 | Film Grain 重点 | 最终编码 |
|---|---|---|
| **AV1 Main10 + grav1synth** | Film Grain metadata、Film Preset、Photon ISO、现成 Grain Table；也可选择像素颗粒 | AV1 Main10 NVENC |
| **HEVC Main10** | 真实扫描 Grain Plate、Digital Grain、GPU Film Grain (FGSIM) | HEVC Main10 NVENC |
| **H.264 x264 Grain** | 真实扫描 Grain Plate、Digital Grain、GPU Film Grain (FGSIM) | libx264 + tune grain |

默认配置仍为 **AV1 Main10 + MP4 + AAC 256k**。

## 颗粒方式

FGS 当前同时提供四类不同机制的 Film Grain：

- **AV1 Film Grain metadata**：颗粒模型写入 AV1 码流，由播放器解码时合成，适合重视码率效率的 AV1 工作流。
- **真实扫描 Grain Plate**：将真实胶片扫描素材直接合成进像素，主要用于 HEVC / x264 路线。
- **Digital Grain · Fast Noise**：不依赖外部 Grain Plate 的像素颗粒引擎，三条主线均可使用，强度连续可调。
- **GPU Film Grain (FGSIM)**：使用 GPU shader / Vulkan 路径生成并烘焙颗粒；HEVC 遇到少数色带素材时可按需尝试 CQ27 / CQ23 方案。

## 其它主要功能

- HDR Preserve 与 HDR→SDR 自动兼容；
- LUT Gallery、预览图、Recent / Favorites 与智能过滤；
- BWDIF Vulkan / CUDA、W3FDIF Complex 自动 Field-rate 反交错；
- OpenSVPFlow GPU 60 fps 插帧；
- Cinematic Style 加黑边 / 裁剪；
- AV1 UHQ 与 SFE 多引擎并行；
- 自动码率、高动态模式与可见的 VBV 计算；
- 独立字幕烧写与 H.264 上传母版；
- 简体中文 / English 多语言 GUI；
- GUI / CLI 共用 StudioBridge 编码核心。

完整功能、参数、工作原理与使用方法请直接查看仓库首页的 **README.md**；历史版本变化请查看 **CHANGELOG.md**。

## 与 v4.8.0 的兼容性

v4.8.1 完整继承 v4.8.0 的程序功能与编码逻辑。本次没有调整 AV1 / HEVC / x264、FGSIM、Digital Grain、Grain Plate、HDR、LUT、OpenSVPFlow、反交错、码率、字幕、容器或 AAC 256k 参数。

正式包继续由 **Windows Server 2022 runner** 构建，并执行现有 PowerShell、语言文件、BAT/CMD/VBS、BOM、CRLF、续行与必需资源检查。
'@
          [System.IO.File]::WriteAllText('.github\release\RELEASE_NOTES.md',($releaseNotes -replace "\r?\n", "`n"),$utf8NoBom)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md Utils/FilmGrain_Studio.ps1 README_FilmGrain_Studio.txt README_Toolkit.txt STABLE_BASELINE.txt .github/release/version.txt .github/release/RELEASE_NOTES.md
          git commit -m 'release: prepare v4.8.1 documentation and Chinese release notes [skip ci]'
          git push origin HEAD:release/v4.8.1
