name: Prepare v4.8.1 README

on:
  push:
    branches:
      - release/v4.8.1
    paths:
      - '.github/workflows/prepare-v4.8.1.yml'
      - '.github/release/README_v4.8.1.part01.b64'
      - '.github/release/README_v4.8.1.part02.b64'
      - '.github/release/README_v4.8.1.part03.b64'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-2022
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore reviewed README
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            '.github\release\README_v4.8.1.part01.b64',
            '.github\release\README_v4.8.1.part02.b64',
            '.github\release\README_v4.8.1.part03.b64'
          )
          $payload = (($parts | ForEach-Object { (Get-Content -LiteralPath $_ -Raw).Trim() }) -join '')
          $compressed = [Convert]::FromBase64String($payload)
          $memory = New-Object System.IO.MemoryStream(,$compressed)
          $gzip = New-Object System.IO.Compression.GZipStream($memory,[System.IO.Compression.CompressionMode]::Decompress)
          $output = New-Object System.IO.MemoryStream
          $gzip.CopyTo($output)
          $gzip.Dispose()
          $memory.Dispose()
          $bytes = $output.ToArray()
          $output.Dispose()

          $sha = [System.BitConverter]::ToString((New-Object System.Security.Cryptography.SHA256Managed).ComputeHash($bytes)).Replace('-','').ToLowerInvariant()
          if ($sha -ne '04be832fda17289dd52ca33c254fb8a7f969f5881050bba72d484c90243c1bee') {
            throw "README payload checksum mismatch: $sha"
          }

          [System.IO.File]::WriteAllBytes('README.md',$bytes)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if (-not (git diff --cached --quiet)) {
            git commit -m 'docs: reorganize README as current product guide [skip ci]'
            git push origin HEAD:release/v4.8.1
          }
