name: Release Film Grain Studio v4.6.3.1 Windows

on:
  push:
    paths:
      - '.github/workflows/release-v4.6.3.1-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Run Windows release validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/release_v4631.py
