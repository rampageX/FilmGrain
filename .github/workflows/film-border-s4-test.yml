name: FGS Film Border S4 test
on:
  push:
    branches:
      - test/film-border-s4
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and audit FGS
        shell: cmd
        run: dotnet\build_NET_Preview.bat
      - uses: actions/upload-artifact@v4
        with:
          name: FGS-FilmBorder-S4-Windows
          if-no-files-found: error
          path: FilmGrain_Studio.exe
